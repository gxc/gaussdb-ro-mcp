# 向 MCP 官方注册表（registry.modelcontextprotocol.io）发布服务器元数据。
# 认证走 GitHub Actions OIDC（io.github.gxc/ 命名空间由本仓库归属自动验证）。
name: Publish to MCP Registry

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  id-token: write # mcp-publisher login github-oidc 需要 OIDC 令牌
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz
          sudo mv mcp-publisher /usr/local/bin/

      # server.json 中的 version 跟随 tag（去掉 v 前缀），无需手改
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          jq --arg v "${GITHUB_REF_NAME#v}" '.version = $v' server.json > server.json.tmp
          mv server.json.tmp server.json

      - name: Login to MCP Registry (OIDC)
        run: mcp-publisher login github-oidc

      - name: Publish server.json
        run: mcp-publisher publish
