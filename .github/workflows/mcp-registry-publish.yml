# 向 MCP 官方注册表（registry.modelcontextprotocol.io）发布服务器元数据。
# 认证走 GitHub Actions OIDC（io.github.gxc/ 命名空间由本仓库归属自动验证）。
name: Publish to MCP Registry

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  id-token: write # mcp-publisher login github-oidc 需要 OIDC 令牌
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # 拉取完整历史：手动触发时需要用 tag 历史推导最新版本
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz
          sudo mv mcp-publisher /usr/local/bin/

      # server.json 中的 version 跟随 tag（去掉 v 前缀），无需手改。
      # tag 触发直接取触发 tag；手动触发取 HEAD 可达的最新 v* tag——
      # 避免把仓库里提前对齐的未发布版本号发布到 registry。
      - name: Sync version from tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
            echo "tag 触发：使用触发 tag ${GITHUB_REF_NAME}"
          else
            latest="$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || true)"
            if [[ -z "$latest" ]]; then
              echo "::error::未找到任何 v* tag，无法推导 server.json 版本号" >&2
              exit 1
            fi
            version="${latest#v}"
            echo "手动触发：使用最新 tag ${latest} 同步 server.json 版本"
          fi
          jq --arg v "$version" '.version = $v' server.json > server.json.tmp
          mv server.json.tmp server.json

      - name: Login to MCP Registry (OIDC)
        run: mcp-publisher login github-oidc

      - name: Publish server.json
        run: mcp-publisher publish
