# push 到 main 与所有 PR 的自动检查，与 Release 工作流的发布前置检查保持同一口径。
# push 仅限 main：PR 分支的推送由 pull_request 事件覆盖，避免同一提交重复运行。
# 除 vet/test 外额外做四平台交叉编译与 govulncheck——vendor/ 或依赖变更可能
# 只破坏特定平台构建（如 windows/amd64），govulncheck 则只对实际调用图中的
# 已知漏洞报警（require 但未调用不拦截），在合并前拦截安全回归。
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true # 同一 PR/分支的新推送取消进行中的旧运行

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # 集成测试由 GAUSSDB_RO_MCP_TEST_DSN 环境变量门控，未设置自动跳过（与本地/发布一致）
      - name: Vet & Test
        run: |
          go vet ./...
          go test ./...

      - name: Cross-compile (release platforms)
        run: |
          for platform in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            os="${platform%/*}"
            arch="${platform#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -o /dev/null ./cmd/gaussdb-ro-mcp
          done

      # 版本固定保证检查可复现；升级时同步更新此处的版本号
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
